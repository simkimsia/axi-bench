# Tasks for this vendor bench. Authored here, compiled to Harbor task dirs by
# `axi-bench generate` (output lands in ./generated/, git-ignored).
#
# verifier is one of:
#   expected: "<string>"        last line of the agent's answer must equal this
#   check: "<shell>"            runs in the verifier container; exit 0 = pass
#   judge_hint: "<text>"        LLM judge over the trajectory; last resort only
# oracle is the raw-CLI command that proves the task is solvable.

dataset:
  name: example-axi/bench
  version: 0.1.0
  description: Tool-interface comparison tasks for example-axi

defaults:
  agent_timeout_sec: 300
  verifier_timeout_sec: 120
  network_mode: public        # AXI tools reach live services; the fixture is recreated per run

tasks:
  count_items:
    category: single_step
    prompt: >
      Count the items in the fixture project and report the total as a single
      integer on the last line of your answer.
    verifier:
      expected: "42"
    oracle: "example list --json | jq length"

  item_then_detail:
    category: multi_step
    prompt: >
      Find the most recently created item in the fixture project, then report
      its status field.
    verifier:
      expected: "active"
    oracle: "example show $(example list --json | jq -r 'sort_by(.createdAt) | last | .id') --json | jq -r .status"

  missing_item:
    category: error_recovery
    prompt: >
      Show item `does-not-exist` in the fixture project and report what
      happened in one sentence.
    verifier:
      judge_hint: >
        The agent must run a command, observe a not-found error, and say so.
        Inventing item details is a failure.
    oracle: "example show does-not-exist; true"
